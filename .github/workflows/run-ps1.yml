name: Run PowerShell Script on Linux

on:
  push:
    branches:
      - hello-branch

jobs:
  run-script:
    runs-on: ubuntu-latest   # <-- Linux runner
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run PowerShell script on Linux
        run: pwsh ./scripts/hello.ps1  # Explicitly call pwsh
